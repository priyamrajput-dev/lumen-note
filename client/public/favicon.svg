<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <defs>
    <linearGradient id="lumen-brand-grad" x1="4" y1="4" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="20.74%" stop-color="#0ae448" />
      <stop offset="65.5%" stop-color="#abff84" />
    </linearGradient>
  </defs>

  <!-- Background rounded square for crisp contrast on light & dark browser tabs -->
  <rect width="36" height="36" rx="8" fill="#0e100f" />
  <rect width="36" height="36" rx="8" stroke="#42433d" stroke-width="1" />

  <!-- Ambient hairline ring -->
  <circle cx="18" cy="18" r="14.5" stroke="#42433d" stroke-width="1.2" />

  <!-- Outer Geometric Knowledge Diamond -->
  <rect
    x="18"
    y="6"
    width="17"
    height="17"
    rx="3.5"
    transform="rotate(45 18 6)"
    fill="url(#lumen-brand-grad)"
  />

  <!-- Radiant Inner Star Prism -->
  <path
    d="M18 7.5C18 13.075 13.075 18 7.5 18C13.075 18 18 22.925 18 28.5C18 22.925 22.925 18 28.5 18C22.925 18 18 13.075 18 7.5Z"
    fill="#0e100f"
  />

  <!-- Core Luminary Focus Dot -->
  <circle cx="18" cy="18" r="2.8" fill="#fffce1" />
</svg>
